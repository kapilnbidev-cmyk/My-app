<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video Star</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d1b;color:#fff;font-family:Arial,sans-serif}
header{background:linear-gradient(135deg,#ff007a,#762cff);padding:18px;text-align:center;font-size:25px;font-weight:bold}
.container{max-width:650px;margin:auto;padding:15px 15px 90px}
.card{background:#151d32;padding:18px;border-radius:18px;margin:15px 0;box-shadow:0 5px 20px #0006}
input,button,textarea{width:100%;padding:13px;margin:7px 0;border:0;border-radius:10px;font-size:15px}
input,textarea{background:#252e46;color:#fff}
button{background:linear-gradient(135deg,#ff007a,#762cff);color:#fff;font-weight:bold}
.secondary{background:#29344e}.danger{background:#d7193f}
.hidden{display:none}.center{text-align:center}.logo{text-align:center;font-size:55px}
.small{font-size:12px;color:#aeb6ca}.success{color:#40e68b}.warning{color:#ffd447}.error{color:#ff5577}
.stat{display:inline-block;background:#242d46;padding:9px;border-radius:10px;margin:3px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#111729;display:flex;justify-content:space-around;padding:7px;z-index:20}
.nav button{background:none;padding:5px 2px;margin:0;font-size:12px}
.video{background:#101625;border-radius:15px;margin:15px 0;padding:14px}
.video video{width:100%;max-height:500px;border-radius:12px;background:#000}
.actions{display:flex;gap:5px}
.actions button{background:#252e46;font-size:12px;margin:4px 0}
.progress{height:12px;background:#30384d;border-radius:20px;overflow:hidden}
.progress div{height:100%;background:linear-gradient(90deg,#ff007a,#762cff);width:0}
hr{border:0;border-top:1px solid #30384d;margin:18px 0}
.play{font-size:18px}
</style>
</head>
